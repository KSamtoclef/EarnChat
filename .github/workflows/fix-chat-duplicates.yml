name: Fix chat duplicate UI and return offer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-chat-duplicates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Prevent the first automatic opener from being added twice.
          s = s.replace(
            "var chatConvo=[],chatPending=false,curP=null;",
            "var chatConvo=[],chatPending=false,curP=null,chatStartToken=0,chatOpenerTimer=null,lastAddedMessage={side:'',text:'',at:0};"
          )
          s = s.replace(
            "function startChat(idx, presetOpener){\n  var now=Math.floor(Date.now()/1000);",
            "function startChat(idx, presetOpener){\n  var thisStartToken=++chatStartToken;\n  if(chatOpenerTimer){clearTimeout(chatOpenerTimer);chatOpenerTimer=null;}\n  var now=Math.floor(Date.now()/1000);"
          )
          s = s.replace(
            "  setTimeout(function(){\n    rmTyper();\n    addMsg('them', opener);\n    document.getElementById('c-stat').textContent='Online now';\n  }, delay);",
            "  chatOpenerTimer=setTimeout(function(){\n    if(thisStartToken!==chatStartToken)return;\n    rmTyper();\n    addMsg('them', opener);\n    document.getElementById('c-stat').textContent='Online now';\n    chatOpenerTimer=null;\n  }, delay);"
          )
          s = s.replace(
            "function addMsg(side,text){\n  var msgs=document.getElementById('chat-msgs');",
            "function addMsg(side,text){\n  text=String(text||'');\n  var now=Date.now();\n  if(lastAddedMessage.side===side&&lastAddedMessage.text===text&&now-lastAddedMessage.at<2500)return;\n  lastAddedMessage={side:side,text:text,at:now};\n  var msgs=document.getElementById('chat-msgs');"
          )
          s = s.replace("bubble.textContent=String(text||'');", "bubble.textContent=text;")
          s = s.replace("content:String(text||'')", "content:text")

          # 2) Add a small return-offer modal that appears only after returning from an external activity.
          return_modal = '''\n<div id="return-sponsored-modal" role="dialog" aria-modal="true" aria-hidden="true" style="position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px;">\n  <div style="width:min(100%,360px);background:#121A16;border:1px solid #1F2E28;border-radius:18px;padding:20px;text-align:center;">\n    <div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7A9E90;margin-bottom:8px;">Sponsored · Optional</div>\n    <h3 style="font-size:18px;margin-bottom:7px;">Explore a member offer</h3>\n    <p style="font-size:13px;line-height:1.55;color:#7A9E90;margin-bottom:14px;">This offer is separate from your saved chat progress.</p>\n    <button id="return-sponsored-open" type="button" style="display:block;width:100%;background:#00C896;color:#000;border:0;border-radius:12px;padding:13px;font-weight:800;margin-bottom:9px;">View sponsored offer</button>\n    <button id="return-sponsored-skip" type="button" style="display:block;width:100%;background:#1A2520;color:#E8F5F0;border:1px solid #1F2E28;border-radius:12px;padding:12px;font-weight:700;">Continue without offer</button>\n  </div>\n</div>\n'''
          if 'id="return-sponsored-modal"' not in s:
            s = s.replace('</body>', return_modal + '\n</body>')

          return_script = '''\n<script>\n(function(){\n  var RETURN_KEY='earn_chat_external_return_offer_v1';\n  var modal=document.getElementById('return-sponsored-modal');\n  if(!modal)return;\n  function hide(){modal.style.display='none';modal.setAttribute('aria-hidden','true');}\n  function show(){\n    if(sessionStorage.getItem(RETURN_KEY)!=='1')return;\n    sessionStorage.removeItem(RETURN_KEY);\n    setTimeout(function(){modal.style.display='flex';modal.setAttribute('aria-hidden','false');},450);\n  }\n  var originalOpenLink=window.openLink;\n  if(typeof originalOpenLink==='function'){\n    window.openLink=function(key){\n      if(key!=='kyc')sessionStorage.setItem(RETURN_KEY,'1');\n      return originalOpenLink.apply(this,arguments);\n    };\n  }\n  document.getElementById('return-sponsored-open').addEventListener('click',function(){hide();if(typeof window.openLink==='function')window.openLink('dash1');});\n  document.getElementById('return-sponsored-skip').addEventListener('click',hide);\n  window.addEventListener('focus',show);\n  document.addEventListener('visibilitychange',function(){if(!document.hidden)show();});\n})();\n</script>\n'''
          if 'earn_chat_external_return_offer_v1' not in s:
            s = s.replace('</body>', return_script + '\n</body>')

          # 3) Remove the duplicate KYC-page sponsored card shown in the screenshot.
          cleanup_script = '''\n<script>\n(function(){\n  function removeDuplicateKycOffer(){\n    document.querySelectorAll('div,a,section').forEach(function(el){\n      var text=(el.innerText||'').replace(/\\s+/g,' ').trim();\n      if(text.indexOf('Featured member activity')>-1 && text.indexOf('OPEN OPTIONAL ACTIVITY')>-1){\n        var parent=el;\n        while(parent.parentElement && parent.parentElement.innerText && parent.parentElement.innerText.trim()===text)parent=parent.parentElement;\n        parent.remove();\n      }\n    });\n  }\n  document.addEventListener('DOMContentLoaded',removeDuplicateKycOffer);\n  setTimeout(removeDuplicateKycOffer,300);\n})();\n</script>\n'''
          if 'removeDuplicateKycOffer' not in s:
            s = s.replace('</body>', cleanup_script + '\n</body>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-chat-duplicates.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/fix-chat-duplicates.yml
          git commit -m "Fix duplicate chat opener and return offer flow" || exit 0
          git push
